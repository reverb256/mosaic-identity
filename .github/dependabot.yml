version: 2
updates:
  # github-actions ecosystem removed 2026-11-23: this repo has no
  # .github/workflows/ or action.yml, so Dependabot failed weekly with
  # dependency_file_not_found. Re-add only if workflows are introduced.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "automated"]
    groups:
      npm:
        patterns: ["*"]
